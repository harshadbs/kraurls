<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1d4ed8">
<title>Linked Documents</title>
<style>
	:root {
		--bg: #eef2f8;
		--surface: #ffffff;
		--surface-2: #f6f8fc;
		--text: #0f172a;
		--muted: #64748b;
		--border: #e2e8f0;
		--accent: #1d4ed8;
		--accent-2: #4f46e5;
		--accent-soft: #e0e7ff;
		--ok: #059669;
		--hero-ink: #ffffff;
		--shadow: 0 18px 40px rgba(15, 23, 42, 0.10), 0 2px 6px rgba(15, 23, 42, 0.06);
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #0b1120;
			--surface: #131c2e;
			--surface-2: #1a2438;
			--text: #e5ebf5;
			--muted: #94a3b8;
			--border: #24324a;
			--accent: #7aa2ff;
			--accent-2: #a5b4fc;
			--accent-soft: #1e2a4a;
			--ok: #34d399;
			--shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
		}
	}
	* { box-sizing: border-box; }
	html { -webkit-text-size-adjust: 100%; }
	body {
		margin: 0;
		min-height: 100vh;
		min-height: 100dvh;
		background: var(--bg);
		color: var(--text);
		font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
		line-height: 1.45;
	}

	/* hero */
	.hero {
		position: relative;
		overflow: hidden;
		padding: calc(28px + env(safe-area-inset-top)) 16px 76px;
		background: linear-gradient(135deg, #1d4ed8 0%, #4f46e5 55%, #7c3aed 100%);
		color: var(--hero-ink);
	}
	.hero::before,
	.hero::after {
		content: "";
		position: absolute;
		border-radius: 50%;
		background: rgba(255, 255, 255, 0.10);
	}
	.hero::before { width: 260px; height: 260px; top: -120px; right: -70px; }
	.hero::after { width: 180px; height: 180px; bottom: -110px; left: -50px; }
	.hero-inner { position: relative; max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
	.hero-icon {
		flex: none;
		display: grid;
		place-items: center;
		width: 52px;
		height: 52px;
		border-radius: 16px;
		background: rgba(255, 255, 255, 0.16);
		border: 1px solid rgba(255, 255, 255, 0.28);
		backdrop-filter: blur(6px);
	}
	.hero h1 { margin: 0; font-size: clamp(20px, 5vw, 26px); font-weight: 750; letter-spacing: -0.01em; }
	.hero p { margin: 2px 0 0; font-size: 14px; opacity: 0.88; }

	/* content */
	main { position: relative; max-width: 720px; margin: -52px auto 0; padding: 0 16px calc(32px + env(safe-area-inset-bottom)); }
	.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow); padding: 14px; }
	.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 6px 12px; }
	.count { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 650; color: var(--muted); }
	.count b {
		display: inline-grid;
		place-items: center;
		min-width: 26px;
		height: 26px;
		padding: 0 8px;
		border-radius: 999px;
		background: var(--accent-soft);
		color: var(--accent);
		font-size: 13px;
	}
	.search {
		flex: 1 1 auto;
		max-width: 240px;
		height: 38px;
		padding: 0 12px;
		border: 1px solid var(--border);
		border-radius: 12px;
		background: var(--surface-2);
		color: var(--text);
		font: inherit;
		font-size: 14px;
	}
	.search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

	/* minmax(0, …): a long code must truncate, not widen the column past the screen */
	.list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
	@media (min-width: 720px) { .list { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

	.item {
		display: flex;
		align-items: center;
		gap: 12px;
		min-width: 0;
		padding: 12px;
		border: 1px solid var(--border);
		border-radius: 16px;
		background: var(--surface-2);
		transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
		animation: rise 0.35s ease both;
	}
	.item:hover { border-color: var(--accent); box-shadow: 0 6px 18px rgba(29, 78, 216, 0.12); transform: translateY(-1px); }
	@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
	@media (prefers-reduced-motion: reduce) { .item { animation: none; transition: none; } }

	.num {
		flex: none;
		display: grid;
		place-items: center;
		width: 40px;
		height: 40px;
		border-radius: 12px;
		background: linear-gradient(135deg, var(--accent), var(--accent-2));
		color: #fff;
		font-weight: 750;
		font-size: 15px;
	}
	.open { flex: 1 1 auto; min-width: 0; text-decoration: none; color: inherit; }
	.open:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 8px; }
	.label { display: block; font-weight: 700; font-size: 15px; color: var(--text); }
	.code {
		display: block;
		margin-top: 2px;
		font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
		font-size: 12.5px;
		color: var(--muted);
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
	}
	.actions { flex: none; display: flex; gap: 6px; }
	.btn {
		display: grid;
		place-items: center;
		width: 40px;
		height: 40px;
		border: 1px solid var(--border);
		border-radius: 12px;
		background: var(--surface);
		color: var(--accent);
		cursor: pointer;
		text-decoration: none;
	}
	.btn:hover { border-color: var(--accent); }
	.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
	.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
	.btn.done { color: var(--ok); border-color: var(--ok); }

	.empty { padding: 36px 12px; text-align: center; color: var(--muted); }
	.empty strong { display: block; margin-bottom: 4px; color: var(--text); font-size: 16px; }
	footer { margin-top: 16px; text-align: center; font-size: 12px; color: var(--muted); }
	footer span { display: inline-flex; align-items: center; gap: 6px; }
	[hidden] { display: none !important; }
</style>
</head>
<body>
<header class="hero">
	<div class="hero-inner">
		<div class="hero-icon" aria-hidden="true">
			<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 17h4v4h-4z"/></svg>
		</div>
		<div>
			<h1 id="title">Linked documents</h1>
			<p id="subtitle">Every link from one scan</p>
		</div>
	</div>
</header>

<main>
	<section class="panel" aria-labelledby="title">
		<div class="toolbar">
			<span class="count"><b id="count">0</b><span id="countLabel">links</span></span>
			<input id="search" class="search" type="search" placeholder="Search" aria-label="Search links" hidden>
		</div>
		<ul id="list" class="list"></ul>
		<div id="empty" class="empty" hidden>
			<strong>No links in this code</strong>
			Scan the QR code again, or ask the sender for a new one.
		</div>
	</section>
	<footer><span>
		<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
		The links are read on this device only and are never sent to this site.
	</span></footer>
</main>

<template id="row">
	<li class="item">
		<span class="num"></span>
		<a class="open" target="_blank" rel="noopener noreferrer">
			<span class="label"></span>
			<span class="code"></span>
		</a>
		<span class="actions">
			<button type="button" class="btn copy" aria-label="Copy link">
				<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
			</button>
			<a class="btn primary go" target="_blank" rel="noopener noreferrer" aria-label="Open link">
				<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>
			</a>
		</span>
	</li>
</template>

<script>
/*
 * Links come in the part of the address after "#", which browsers never send
 * to the host, as &-separated pairs, read in order:
 *   h=<title>        optional page title
 *   p=<prefix>       shared start of the links that follow
 *   s=<suffix>       one link: prefix + suffix
 *   u=<url>          one link, written in full
 *   t=<label>        optional label for the next link
 *   l=<word>         optional name for unlabelled links: "<word> 1", "<word> 2", …
 * Only http(s) links are shown, so a crafted code cannot run script.
 */
(function () {
	var strRaw = location.hash.replace(/^#/, "") || location.search.replace(/^\?/, "");
	var arrLinks = [];
	var strPrefix = "";
	var strLabel = "";
	var strTitle = "";
	var strBaseLabel = "";

	strRaw.split("&").forEach(function (strPair) {
		var intAt = strPair.indexOf("=");
		if (intAt < 1) return;
		var strKey = strPair.slice(0, intAt);
		var strValue;
		try { strValue = decodeURIComponent(strPair.slice(intAt + 1).replace(/\+/g, " ")); } catch (e) { return; }
		if (strKey === "h") strTitle = strValue;
		else if (strKey === "p") strPrefix = strValue;
		else if (strKey === "l") strBaseLabel = strValue;
		else if (strKey === "t") strLabel = strValue;
		else if (strKey === "u" || strKey === "s") {
			addLink(strKey === "s" ? strPrefix + strValue : strValue);
			strLabel = "";
		}
	});

	function addLink(strUrl) {
		var objUrl;
		try { objUrl = new URL(strUrl); } catch (e) { return; }
		if (objUrl.protocol !== "https:" && objUrl.protocol !== "http:") return;
		arrLinks.push({
			strUrl: objUrl.href,
			strLabel: strLabel,
			// what tells the links apart: the last query value (a receipt code), else the path
			strCode: lastValue(objUrl) || objUrl.hostname + objUrl.pathname
		});
	}

	function lastValue(objUrl) {
		var strLast = "";
		objUrl.searchParams.forEach(function (strValue) { strLast = strValue; });
		return strLast;
	}

	if (strTitle) {
		document.getElementById("title").textContent = strTitle;
		document.title = strTitle;
	}
	var strHost = arrLinks.length ? new URL(arrLinks[0].strUrl).hostname : "";
	var blnOneHost = arrLinks.every(function (o) { return new URL(o.strUrl).hostname === strHost; });
	if (strHost && blnOneHost) document.getElementById("subtitle").textContent = strHost;

	document.getElementById("count").textContent = arrLinks.length;
	document.getElementById("countLabel").textContent = arrLinks.length === 1 ? "link" : "links";
	if (!arrLinks.length) {
		document.getElementById("empty").hidden = false;
		return;
	}

	var elList = document.getElementById("list");
	var elTemplate = document.getElementById("row");
	arrLinks.forEach(function (objLink, intAt) {
		var elRow = elTemplate.content.firstElementChild.cloneNode(true);
		var strName = objLink.strLabel || (strBaseLabel || "Link") + " " + (intAt + 1);
		elRow.style.animationDelay = Math.min(intAt * 40, 400) + "ms";
		elRow.querySelector(".num").textContent = intAt + 1;
		elRow.querySelector(".label").textContent = strName;
		elRow.querySelector(".code").textContent = objLink.strCode;
		elRow.querySelector(".open").href = objLink.strUrl;
		elRow.querySelector(".open").title = objLink.strUrl;
		var elGo = elRow.querySelector(".go");
		elGo.href = objLink.strUrl;
		elGo.setAttribute("aria-label", "Open " + strName);
		var elCopy = elRow.querySelector(".copy");
		elCopy.setAttribute("aria-label", "Copy " + strName);
		elCopy.addEventListener("click", function () { copy(objLink.strUrl, elCopy); });
		elRow.dataset.search = (strName + " " + objLink.strUrl).toLowerCase();
		elList.appendChild(elRow);
	});

	// a search box only once the list is long enough to need one
	if (arrLinks.length > 6) {
		var elSearch = document.getElementById("search");
		elSearch.hidden = false;
		elSearch.addEventListener("input", function () {
			var strNeedle = elSearch.value.trim().toLowerCase();
			Array.prototype.forEach.call(elList.children, function (elRow) {
				elRow.hidden = strNeedle !== "" && elRow.dataset.search.indexOf(strNeedle) < 0;
			});
		});
	}

	function copy(strText, elButton) {
		var fnDone = function () {
			elButton.classList.add("done");
			setTimeout(function () { elButton.classList.remove("done"); }, 1400);
		};
		if (navigator.clipboard && window.isSecureContext) {
			navigator.clipboard.writeText(strText).then(fnDone, function () { fallbackCopy(strText) && fnDone(); });
		} else if (fallbackCopy(strText)) fnDone();
	}

	function fallbackCopy(strText) {
		var elArea = document.createElement("textarea");
		elArea.value = strText;
		elArea.setAttribute("readonly", "");
		elArea.style.position = "fixed";
		elArea.style.opacity = "0";
		document.body.appendChild(elArea);
		elArea.select();
		var blnOk = false;
		try { blnOk = document.execCommand("copy"); } catch (e) { blnOk = false; }
		document.body.removeChild(elArea);
		return blnOk;
	}
})();
</script>
</body>
</html>
